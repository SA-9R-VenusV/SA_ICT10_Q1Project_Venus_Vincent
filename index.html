<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU & Receipt Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }

        .tool {
            flex: 1;
            min-width: 320px;
            max-width: 420px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .menu-item label {
            display: inline;
            font-weight: normal;
            margin: 0 0 0 8px;
            cursor: pointer;
        }

        .menu-item .price {
            font-weight: bold;
            color: #007BFF;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
            border-radius: 4px;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        #sku_output, #show {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #28A745;
            white-space: pre-line;
            min-height: 40px;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== SKU Generator ==================== -->
    <div class="tool">
        <h2>SKU Generator</h2>

        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category">
                <option value="ELEC">Electronics</option>
                <option value="APPR">Clothes</option>
                <option value="HOME">Kitchenware</option>
                <option value="HOME">Furniture</option>
                <option value="HOME">Decor</option>
            </select>
        </div>

        <div class="form-group">
            <label for="product_name">Product Name:</label>
            <input type="text" id="product_name" placeholder="e.g. Wireless Mouse">
        </div>

        <div class="form-group">
            <label for="quantity">Stock Quantity:</label>
            <input type="number" id="quantity" placeholder="e.g. 150">
        </div>

        <button py-click="SKU_generator">Generate SKU</button>

        <div id="sku_output" role="status" aria-live="polite"></div>
    </div>

    <!-- ==================== Receipt Generator ==================== -->
    <div class="tool">
        <h2>Receipt Generator</h2>

        <div class="form-group">
            <label>Menu</label>

            <div class="menu-item">
                <div>
                    <input type="checkbox" id="item1" value="99">
                    <label for="item1">Wireless Mouse</label>
                </div>
                <span class="price">₱99</span>
            </div>

            <div class="menu-item">
                <div>
                    <input type="checkbox" id="item2" value="129">
                    <label for="item2">Standard 8-inch Kitchen Knife</label>
                </div>
                <span class="price">₱189</span>
            </div>

            <div class="menu-item">
                <div>
                    <input type="checkbox" id="item3" value="189">
                    <label for="item3">8' x 10' Fluffy Rug</label>
                </div>
                <span class="price">₱159</span>
            </div>

            <div class="menu-item">
                <div>
                    <input type="checkbox" id="item4" value="159">
                    <label for="item4">Italian Leather Wallet</label>
                </div>
                <span class="price">₱219</span>
            </div>

            <div class="menu-item">
                <div>
                    <input type="checkbox" id="item5" value="129">
                    <label for="item5">"I Love You" Mug</label>
                </div>
                <span class="price">₱119</span>
            </div>
        </div>

        <button type="button" py-click="create_order">Create Order</button>

        <div id="show">Your order summary will appear here.</div>
    </div>

    <!-- ==================== Shared PyScript ==================== -->
    <script type="py">
        from pyscript import document

        def SKU_generator(e):
            document.getElementById('sku_output').textContent = ""
            category = document.getElementById('category').value
            product_name = document.getElementById('product_name').value
            stock_qty = document.getElementById('quantity').value

            clean_cat = "".join(c for c in category if c.isalnum()).upper()[:3]
            clean_name = "".join(c for c in product_name if c.isalnum()).upper()[:3]
            clean_qty = "".join(c for c in stock_qty if c.isdigit())[:3]

            sku = f"{clean_cat}-{clean_name}-{clean_qty}"[:11]

            document.getElementById('sku_output').textContent = f"SKU: {sku}"

        def create_order(e):
            items = [
                ("Wireless Mouse", "item1", 99),
                ("Standard 8-inch Kitchen Knife", "item2", 129),
                ("8' x 10' Fluffy Rug", "item3", 159),
                ("Italian Leather Wallet", "item4", 219),
                ("\"I Love You\" Mug", "item5", 119),
            ]

            selected = []
            total = 0

            for name, id_, price in items:
                checkbox = document.getElementById(id_)
                if checkbox and checkbox.checked:
                    selected.append(f"{name} - ₱{price}")
                    total += price

            output = document.getElementById("show")
            if not selected:
                output.textContent = "No items selected."
            else:
                output.textContent = "Order Summary:\n" + "\n".join(selected) + f"\n\nTotal: ₱{total}"
    </script>

</body>
</html>
